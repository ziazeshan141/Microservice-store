server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: admin-server

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    test-connection: ${MAIL_TEST_CONNECTION:false}

  boot:
    admin:
      ui:
        brand: "<span>Online Shopping Portal Monitoring</span>"
        title: "Online Shopping Portal Monitoring"
        available-languages:
          - en

      notify:
        mail:
          enabled: ${MAIL_NOTIFICATIONS_ENABLED:false}
          to: ${MAIL_TO:devops@example.com}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: always

info:
  app:
    name: Admin Server
    description: Monitoring dashboard for the Online Shopping Portal
    version: 1.0.0